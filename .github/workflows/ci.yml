name: CI

on:
  push:
    branches: [claude/spring-boot-blueprints-setup-UnYFB]
  pull_request:
    branches: [claude/spring-boot-blueprints-setup-UnYFB]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        module:
          - api-design/error-handling
          - api-design/openapi
          - api-design/rest-conventions
          - api-design/validation
          - architecture/event-driven
          - architecture/hexagonal
          - architecture/layered
          - patterns/builder
          - patterns/factory
          - patterns/repository
          - patterns/strategy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml
      - run: ./mvnw --batch-mode --no-transfer-progress -f "${{ matrix.module }}/pom.xml" verify

  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check for generated build output
        run: test -z "$(find . -type d -name target -print -quit)"
