spring:
  application:
    name: hexagonal-architecture
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:h2:mem:hexagonaldb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      # Only health/info are exposed - no env, beans, metrics, or other
      # introspection endpoints. Enough for container liveness/readiness probes.
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
