spring:
  application:
    name: openapi-blueprint
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      # Only health/info are exposed - no env, beans, metrics, or other
      # introspection endpoints. Enough for container liveness/readiness probes.
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /api-docs
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
